[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvta-taplite-workflow-local"
version = "1.0.0"
description = "NVTA Cube-to-GMNS conversion, TAPlite assignment, smoothing, and aggregation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "geopandas>=0.14,<2",
  "numpy>=1.26,<3",
  "openmatrix>=0.3,<1",
  "pandas>=2.1,<3",
  "psutil>=5.9,<7",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
nvta-taplite = "dtalite4cube.runner:main"
nvta-taplite-postprocess = "dtalite_postprocessing.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
dtalite4cube = [
  "resources/*.csv",
  "resources/*.json",
  "resources/**/*.csv",
  "resources/**/*.json",
  "resources/**/*.npy",
  "resources/**/*.md",
  "resources/**/*.py",
]

[tool.setuptools.exclude-package-data]
dtalite4cube = [
  "resources/**/__pycache__/*",
  "resources/**/*.pyc",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
