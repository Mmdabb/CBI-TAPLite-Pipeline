[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbi-qvdf"
version = "1.0.0"
description = "Congestion bottleneck identification and QVDF calibration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
cbi = "cbi.cli:main"
cbi-canonical-map = "cbi.canonical_cli:main"
cbi-congestion-boundaries = "congestion_boundary_mapping.cli:main"
cbi-network-qvdf = "cbi.network_qvdf:main"
cbi-spatial-t2 = "t2_coverage_expansion.cli:main"
cbi-ridge-train = "t2_ml_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
congestion_boundary_mapping = ["resources/**/*"]
t2_coverage_expansion = ["config/*.json"]
t2_ml_experiment = ["config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
